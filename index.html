<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор аруко карты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <div class="container">

        <div class="d-inline-flex justify-content-between flex-wrap">
            <div class="m-2 flex-fill">
                <label class="form-label" for="length">length: </label>
                <input class="form-control" type="number" name="length" id="length" value="0.335">
            </div>
            <div class="m-2 flex-fill">
                <label class="form-label" for="markers_x">markers_x: </label>
                <input class="form-control" type="number" name="markers_x" id="markers_x" value="10">
            </div>
            <div class="m-2 flex-fill">
                <label class="form-label" for="markers_y">markers_y: </label>
                <input class="form-control" type="number" name="markers_y" id="markers_y" value="10">
            </div>
            <div class="m-2 flex-fill">
                <label class="form-label" for="dist_x">dist_x: </label>
                <input class="form-control" type="number" name="dist_x" id="dist_x" value="1">
            </div>
            <div class="m-2 flex-fill">
                <label class="form-label" for="dist_y">dist_y: </label>
                <input class="form-control" type="number" name="dist_y" id="dist_y" value="1">
            </div>
            <div class="m-2 flex-fill">
                <label class="form-label" for="first">first: </label>
                <input class="form-control" type="number" name="first" id="first" value="0">
            </div>
            <div class="m-2 flex-fill">
                <label class="form-label" for="x0">x0: </label>
                <input class="form-control" type="number" name="x0" id="x0" value="0">
            </div>
            <div class="m-2 flex-fill">
                <label class="form-label" for="y0">y0: </label>
                <input class="form-control" type="number" name="y0" id="y0" value="0">
            </div>
            
        </div>

        <div class="m-2 d-flex align-items-center">
                <div class="form-switch align-middle">
                    <input class="form-check-input" type="checkbox" name="bottom_left" role="switch" id="bottom_left">
                    <label class="form-check-label" for="bottom_left">bottom_left</label>
                </div>
            </div>

        <div class="m-2">
            <button id="generate_button" class="btn btn-primary">generate</button>
        </div>
        <div class="m-2">
            <textarea class="form-control" id="test_out" rows="20" wrap="off"></textarea>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./genmap.js"></script>
    <script>
        document.getElementById('generate_button').addEventListener('click', () => {
            let length = document.getElementById('length').valueAsNumber
            let first = document.getElementById('first').valueAsNumber
            let x0 = document.getElementById('x0').valueAsNumber
            let y0 = document.getElementById('y0').valueAsNumber
            let markers_x = document.getElementById('markers_x').valueAsNumber
            let markers_y = document.getElementById('markers_y').valueAsNumber
            let dist_x = document.getElementById('dist_x').valueAsNumber
            let dist_y = document.getElementById('dist_y').valueAsNumber
            let bottom_left = document.getElementById('bottom_left').checked

            let map = aruco_gen_str(
                length, markers_x, markers_y, dist_x, dist_y,
                first, x0, y0, bottom_left
            )
            document.getElementById('test_out').innerHTML = map
        })
    </script>
</body>

</html>
