<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор аруко карты</title>
</head>

<body>
    <div class="shadow-sm mb-3">
        <header class="container d-flex justify-content-end align-items-center py-3">
            <div class="form-check form-switch d-flex p-2">
                <div>
                    <i class="bi bi-sun"></i>
                </div>
                <div style="margin-left: 45px;">
                    <input class="form-check-input" type="checkbox" role="switch" id="darkModeSwitch">
                </div>
                <div>
                    <i class="bi bi-moon"></i>
                </div>
            </div>
        </header>
    </div>

    <div class="container">

        <div class="mb-5">
            <h3>настройки генерации map.txt:</h3>
            <div class="d-inline-flex justify-content-between flex-wrap">
                <div class="m-2 flex-fill">
                    <label class="form-label" for="length">длина маркера в метрах: </label>
                    <input class="form-control" type="number" id="length" value="0.335">
                </div>
                <div class="m-2 flex-fill">
                    <label class="form-label" for="markers_x">кол-во маркеров по x: </label>
                    <input class="form-control" type="number" id="markers_x" value="10">
                </div>
                <div class="m-2 flex-fill">
                    <label class="form-label" for="markers_y">кол-во маркеров по y: </label>
                    <input class="form-control" type="number" id="markers_y" value="10">
                </div>
                <div class="m-2 flex-fill">
                    <label class="form-label" for="dist_x">расстояние между маркерами по x: </label>
                    <input class="form-control" type="number" id="dist_x" value="1">
                </div>
                <div class="m-2 flex-fill">
                    <label class="form-label" for="dist_y">расстояние между маркерами по x: </label>
                    <input class="form-control" type="number" id="dist_y" value="1">
                </div>
                <div class="m-2 flex-fill">
                    <label class="form-label" for="first">id первого маркера: </label>
                    <input class="form-control" type="number" id="first" value="0">
                </div>
                <div class="m-2 flex-fill">
                    <label class="form-label" for="x0">x первого маркера: </label>
                    <input class="form-control" type="number" id="x0" value="0">
                </div>
                <div class="m-2 flex-fill">
                    <label class="form-label" for="y0">y первого маркера: </label>
                    <input class="form-control" type="number" id="y0" value="0">
                </div>

            </div>

            <div class="m-2">
                <div>
                    <label class="form-label">с какого угла начинается нумерация: </label>
                </div>

                <div class="btn-group-vertical" role="group" aria-label="Vertical radio toggle button group">
                    <input type="radio" class="btn-check" name="is_bottom_left" id="top_left" autocomplete="off"
                        checked>
                    <label class="btn btn-outline-primary" for="top_left">--top-left</label>
                    <input type="radio" class="btn-check" name="is_bottom_left" id="bottom_left" autocomplete="off">
                    <label class="btn btn-outline-primary" for="bottom_left">--bottom-left</label>
                </div>
            </div>
        </div>

        <div class="mb-5">
            <h3>настройки изображения топика:</h3>
            <div class="d-inline-flex justify-content-between flex-wrap">
                <div class="m-2 flex-fill">
                    <label class="form-label" for="topic_width">ширина: </label>
                    <input class="form-control" type="number" id="topic_width" value="600">
                </div>
                <div class="m-2 flex-fill">
                    <label class="form-label" for="topic_height">высота: </label>
                    <input class="form-control" type="number" id="topic_height" value="500">
                </div>
                <div class="m-2 flex-fill">
                    <label class="form-label" for="topic_margin">отступ: </label>
                    <input class="form-control" type="number" id="topic_margin" value="40">
                </div>
            </div>
            <div class="m-2">
                <div class="m-2 flex-fill form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="topic_drawAxis">
                    <label class="form-check-label" for="topic_drawAxis">отобразить координатную ось</label>
                </div>
            </div>
        </div>

        <div class="m-2">
            <button id="generate_button" class="btn btn-primary">сгененрировать карту</button>
            <button id="download_maptxt_button" class="btn btn-primary">скачать map.txt</button>
            <button id="download_topic_button" class="btn btn-primary">скачать топик</button>
        </div>

        <div class="m-2 row">
            <div class="col-12 col-md-6">
                <textarea class="form-control" id="test_out" rows="20" wrap="off"></textarea>
            </div>
            <div class="col-12 col-md-6">
                <canvas id="image_topic" class="w-100"></canvas>
            </div>
        </div>
    </div>

    <div class="container">
        <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
            <div class="col-md-4 d-flex align-items-center">
                <a href="https://github.com/crutoboy/web_gen_arucomap"
                    class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1">
                    <i class="bi bi-github"></i>
                    <span class="mb-3 mb-md-0 text-body-secondary">© crutoboy</span>
                </a>
            </div>
        </footer>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>

</html>
