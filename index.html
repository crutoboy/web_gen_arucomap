<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор аруко карты</title>
    <link rel="icon" href="/favicon.webp" type="image/webp">
    <style>
        [data-bs-toggle="collapse"] {
            cursor: pointer;
        }

        [data-bs-toggle="collapse"]:hover {
            opacity: 0.85;
        }

        .collapse-chevron {
            display: inline-block;
            transition: transform 0.2s ease;
            font-size: 0.85em;
        }

        [aria-expanded="false"] .collapse-chevron {
            transform: rotate(-90deg);
        }
    </style>
</head>

<body>
    <div class="shadow-sm mb-3">
        <header class="container d-flex justify-content-end align-items-center py-3">
            <div>
                <select id="langSelect" class="form-select form-select-sm w-auto"></select>
            </div>
            <div class="form-check form-switch d-flex p-2">
                <div>
                    <i class="bi bi-sun"></i>
                </div>
                <div style="margin-left: 45px;">
                    <input class="form-check-input" type="checkbox" role="switch" id="darkModeSwitch">
                </div>
                <div>
                    <i class="bi bi-moon"></i>
                </div>
            </div>
        </header>
    </div>

    <div class="container mb-5">
        <h2 class="mb-2" data-i18n="page_heading">Генератор ArUco-карты для Clover</h2>
        <p class="text-body-secondary mb-0" data-i18n="project_description">
            Веб-версия <code>genmap.py</code>. Позволяет быстро создать файл <code>map.txt</code>
            и сразу увидеть, как карта будет выглядеть в топике <code>/aruco_map/image</code>.
        </p>
    </div>

    <div class="container">

        <div class="mb-5">
            <h3 data-i18n="settings_maptxt_title">Настройки генерации map.txt:</h3>
            <div class="d-inline-flex justify-content-between flex-wrap">
                <div class="m-2 flex-fill">
                    <label class="form-label" for="length" data-i18n="settings_maptxt_marker_length">длина маркера в метрах: </label>
                    <input class="form-control" type="number" id="length" value="0.335">
                </div>
                <div class="m-2 flex-fill">
                    <label class="form-label" for="markers_x" data-i18n="settings_maptxt_markers_x">кол-во маркеров по x: </label>
                    <input class="form-control" type="number" id="markers_x" value="10">
                </div>
                <div class="m-2 flex-fill">
                    <label class="form-label" for="markers_y" data-i18n="settings_maptxt_markers_y">кол-во маркеров по y: </label>
                    <input class="form-control" type="number" id="markers_y" value="10">
                </div>
                <div class="m-2 flex-fill">
                    <label class="form-label" for="dist_x" data-i18n="settings_maptxt_distance_x">расстояние между маркерами по x: </label>
                    <input class="form-control" type="number" id="dist_x" value="1">
                </div>
                <div class="m-2 flex-fill">
                    <label class="form-label" for="dist_y" data-i18n="settings_maptxt_distance_y">расстояние между маркерами по y: </label>
                    <input class="form-control" type="number" id="dist_y" value="1">
                </div>
                <div class="m-2 flex-fill">
                    <label class="form-label" for="first" data-i18n="settings_maptxt_first_marker_id">id первого маркера: </label>
                    <input class="form-control" type="number" id="first" value="0">
                </div>
                <div class="m-2 flex-fill">
                    <label class="form-label" for="x0" data-i18n="settings_maptxt_first_marker_x">x первого маркера: </label>
                    <input class="form-control" type="number" id="x0" value="0">
                </div>
                <div class="m-2 flex-fill">
                    <label class="form-label" for="y0" data-i18n="settings_maptxt_first_marker_y">y первого маркера: </label>
                    <input class="form-control" type="number" id="y0" value="0">
                </div>

            </div>

            <div class="m-2">
                <div>
                    <label class="form-label" data-i18n="settings_maptxt_start_angle">с какого угла начинается нумерация: </label>
                </div>

                <div class="btn-group" role="group" aria-label="Vertical radio toggle button group">
                    <input type="radio" class="btn-check" name="is_bottom_left" id="top_left" autocomplete="off"
                        checked>
                    <label class="btn btn-outline-primary" for="top_left">--top-left</label>
                    <input type="radio" class="btn-check" name="is_bottom_left" id="bottom_left" autocomplete="off">
                    <label class="btn btn-outline-primary" for="bottom_left">--bottom-left</label>
                </div>
            </div>
        </div>

        <div class="mb-5">
            <div class="m-2">
                <div>
                    <label class="form-label" data-i18n="settings_preview_format">формат предпросмотра: </label>
                </div>

                <div class="btn-group" role="group" aria-label="Vertical radio toggle button group" id="preview_group">
                    <input type="radio" class="btn-check" name="preview_type" id="preview_png_btn" autocomplete="off">
                    <label class="btn btn-outline-primary" for="preview_png_btn">.png</label>
                    <input type="radio" class="btn-check" name="preview_type" id="preview_svg_btn" autocomplete="off"
                        checked>
                    <label class="btn btn-outline-primary" for="preview_svg_btn">.svg</label>
                </div>
            </div>
        </div>

        <div class="mb-5">
            <h4 role="button" data-bs-toggle="collapse" data-bs-target="#imageSettings" aria-expanded="false"
                aria-controls="imageSettings">
                <i class="bi bi-chevron-down collapse-chevron"></i> <span data-i18n="settings_png_title">Настройки изображения в png:</span>
            </h4>
            <div class="collapse" id="imageSettings">
                <div class="d-inline-flex justify-content-between flex-wrap">
                    <div class="m-2 flex-fill">
                        <label class="form-label" for="topic_width" data-i18n="settings_png_width">ширина в пикселях: </label>
                        <input class="form-control" type="number" id="topic_width" value="600">
                    </div>
                    <div class="m-2 flex-fill">
                        <label class="form-label" for="topic_height" data-i18n="settings_png_height">высота в пикселях: </label>
                        <input class="form-control" type="number" id="topic_height" value="600">
                    </div>
                    <div class="m-2 flex-fill">
                        <label class="form-label" for="topic_margin" data-i18n="settings_png_margin">отступ: </label>
                        <input class="form-control" type="number" id="topic_margin" value="40">
                    </div>
                </div>
                <div class="m-2">
                    <div class="m-2 flex-fill form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="topic_drawAxis">
                        <label class="form-check-label" for="topic_drawAxis" data-i18n="settings_png_draw_axis">отобразить координатную ось</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-5">
            <h4 role="button" data-bs-toggle="collapse" data-bs-target="#svgSettings" aria-expanded="false"
                aria-controls="svgSettings">
                <i class="bi bi-chevron-down collapse-chevron"></i> <span data-i18n="settings_svg_title">Настройки изображения в svg:</span>
            </h4>
            <div class="collapse" id="svgSettings">

                <div class="d-inline-flex justify-content-between flex-wrap">
                    <div class="m-2 flex-fill">
                        <label class="form-label" for="svg_pxpm" data-i18n="settings_svg_scale">масштаб (пикселей на метр): </label>
                        <input class="form-control" type="number" id="svg_pxpm" value="200">
                    </div>
                    <div class="m-2 flex-fill">
                        <label class="form-label" for="svg_margin" data-i18n="settings_svg_margin">отсутп: </label>
                        <input class="form-control" type="number" id="svg_margin" value="40">
                    </div>
                </div>
                <div class="m-2">
                    <div class="m-2 flex-fill form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="svg_drawIDs">
                        <label class="form-check-label" for="svg_drawIDs" data-i18n="settings_svg_draw_ids">отобразить id меток</label>
                    </div>
                </div>

            </div>
        </div>

        <div class="m-2">
            <button id="generate_button" class="btn btn-primary" data-i18n="control_genmap">сгенерировать карту</button>
            <button id="download_maptxt_button" class="btn btn-primary" data-i18n="control_download_maptxt">скачать map.txt</button>
            <button id="download_topic_button" class="btn btn-primary" data-i18n="control_download_png" disabled>скачать как .png</button>
            <button id="saveSVG" class="btn btn-primary" data-i18n="control_download_svg">скачать как .svg</button>
        </div>

        <div class="m-2 row">
            <div class="col-12 col-md-6">
                <textarea class="form-control" id="maptxt_preview" rows="20" wrap="off"></textarea>
            </div>
            <div class="col-12 col-md-6">
                <canvas id="image_topic" class="w-100" style="display: none;"></canvas>
                <div id="svg_preview" class="w-100" style="min-height: 300px;"></div>
            </div>
        </div>
    </div>

    <div class="container">
        <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
            <div class="col-md-4 d-flex align-items-center">
                <a href="https://github.com/crutoboy/web_gen_arucomap" target="_blank"
                    class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1">
                    <i class="bi bi-github"></i>
                    <span class="mb-3 mb-md-0 text-body-secondary">© crutoboy</span>
                </a>
            </div>
        </footer>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>

</html>
