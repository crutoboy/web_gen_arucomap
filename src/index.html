<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор аруко карты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <div class="container">

        <div class="d-inline-flex justify-content-between flex-wrap">
            <div class="m-2 flex-fill">
                <label class="form-label" for="length">длина маркера в метрах: </label>
                <input class="form-control" type="number" id="length" value="0.335">
            </div>
            <div class="m-2 flex-fill">
                <label class="form-label" for="markers_x">кол-во маркеров по x: </label>
                <input class="form-control" type="number" id="markers_x" value="10">
            </div>
            <div class="m-2 flex-fill">
                <label class="form-label" for="markers_y">кол-во маркеров по y: </label>
                <input class="form-control" type="number" id="markers_y" value="10">
            </div>
            <div class="m-2 flex-fill">
                <label class="form-label" for="dist_x">расстояние между маркерами по x: </label>
                <input class="form-control" type="number" id="dist_x" value="1">
            </div>
            <div class="m-2 flex-fill">
                <label class="form-label" for="dist_y">расстояние между маркерами по x: </label>
                <input class="form-control" type="number" id="dist_y" value="1">
            </div>
            <div class="m-2 flex-fill">
                <label class="form-label" for="first">id первого маркера: </label>
                <input class="form-control" type="number" id="first" value="0">
            </div>
            <div class="m-2 flex-fill">
                <label class="form-label" for="x0">x первого маркера: </label>
                <input class="form-control" type="number" id="x0" value="0">
            </div>
            <div class="m-2 flex-fill">
                <label class="form-label" for="y0">y первого маркера: </label>
                <input class="form-control" type="number" id="y0" value="0">
            </div>

        </div>

        <div class="m-2">
            <div>
                <label class="form-label">с какого угла начинается нумерация: </label>
            </div>

            <div class="btn-group-vertical" role="group" aria-label="Vertical radio toggle button group">
                <input type="radio" class="btn-check" name="is_bottom_left" id="top_left" autocomplete="off" checked>
                <label class="btn btn-outline-primary" for="top_left">--top-left</label>
                <input type="radio" class="btn-check" name="is_bottom_left" id="bottom_left" autocomplete="off">
                <label class="btn btn-outline-primary" for="bottom_left">--bottom-left</label>
            </div>
        </div>

        <div class="m-2">
            <button id="generate_button" class="btn btn-primary">generate</button>
            <button id="download_maptxt_button" class="btn btn-primary">download map.txt</button>
        </div>

        <div class="m-2">
            <textarea class="form-control" id="test_out" rows="20" wrap="off"></textarea>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./genmap.js"></script>
    <script src="./script.js"></script>
</body>

</html>
